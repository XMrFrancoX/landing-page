<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#0a3055" />
		<meta name="description" content="NMF Soluciones Educativas — Plataforma de gestión escolar: agenda, inventario e intranet para instituciones educativas" />
		<title>NMF Soluciones Educativas</title>
		<!-- Open Graph -->
		<meta property="og:title" content="NMF Soluciones Educativas" />
		<meta property="og:description" content="Plataforma de gestión escolar: agenda, inventario e intranet para instituciones educativas" />
		<meta property="og:type" content="website" />
		<meta property="og:image" content="https://www.nmfsoluciones.com.ar/logo.png" />
		<meta property="og:url" content="https://www.nmfsoluciones.com.ar" />
		<script>
			(function () {
				try {
					var t = localStorage.getItem('theme');
					if (t === 'dark') document.documentElement.classList.add('dark');
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
